server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Cache static assets
  location ~* \.(css|js|png|jpg|jpeg|svg|gif|webp|ico|ttf|woff2?)$ {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # SPA fallback – all other routes serve index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
